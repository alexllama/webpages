<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectrum Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock-container">

                        </div>
                        <div class="bar-item">
                            <div class="light" id="h10"></div>
                            <span class="legend right">10</span>
                        </div>
                        <div class="bar-item">
                            <div class="light" id="h11"></div>
                            <span class="legend right">11</span>
                        </div>
                        <div class="bar-item">
                            <div class="light" id="h12"></div>
                            <span class="legend right">12</span>
                        </div>
                    </div>
                    <!-- 5-Minute Bars -->
                    <div class="bar-group">
                        <div class="bar-item">
                            <div class="light" id="m5"></div>
                            <span class="legend right">05</span>
                        </div>
                        <div class="bar-item">

                        <div class="bar-item">
                            <div class="light" id="m30"></div>

                        <div class="bar-item">
                            <div class="light" id="m35"></div>
                            <span class="legend right">35</span>
                        </div>
                        <div class="bar-item">
                            <div class="light" id="m40"></div>
                            <span class="legend right">40</span>

                        <div class="bar-item">

                        <div class="bar-item">
                            <div class="light" id="m60"></div>
                            <span class="legend right">60</span>
                        </div>
                    </div>
                    <!-- Single-Minute Bars: 3 cells per minute -->
                    <div class="bar-group">
                        <div class="bar-item">
                            <div class="light" id="s-min-1"></div>
                            <span class="legend right">-</span>
                        </div>
                        <div class="bar-item">
                            <div class="light" id="s-min-2"></div>
                            <span class="legend right">-</span>
                        </div>
                        <div class="bar-item">
                            <div class="light" id="s-min-3"></div>
                            <span class="legend right">1</span>
                        </div>

                        <div class="bar-item">
                            <div class="light" id="s-min-11"></div>
                            <span class="legend right">-</span>
                        </div>
                        <div class="bar-item">
                            <div class="light" id="s-min-12"></div>
                            <span class="legend right">4</span>
                        </div>
                    </div>
                    <!-- AM/PM Bars: bottom 6 = AM, all 12 = PM -->
                    <div class="bar-group">
                        <div class="bar-item">
                            <div class="light" id="ap-1"></div>
                            <span class="legend right">-</span>
                        </div>
                        <div class="bar-item">
                            <div class="light" id="ap-2"></div>

                        </div>
                        <div class="bar-item">

                        <div class="bar-item">
                            <div class="light" id="ap-12"></div>
                            <span class="legend right">PM</span>
                        </div>
                    </div>
                </div>
            </section>
            <!-- Date section: month, day tens, day units -->
            <section class="date-section">
                <div class="date-display">
                    <!-- Month Bars -->
                    <div class="bar-group">
                        <div class="bar-item">
                            <div class="light" id="mth1"></div>
                            <span class="legend right">1</span>
                        </div>
                        <div class="bar-item">
                            <div class="light" id="mth2"></div>

                        <div class="bar-item">

                        </div>
                        <div class="bar-item">

                        </div>
                        <div class="bar-item">
                            <div class="light" id="mth6"></div>

                        <div class="bar-item">

                            <span class="legend right">10</span>
                        </div>
                        <div class="bar-item">
                            <div class="light" id="mth11"></div>
                            <span class="legend right">11</span>
                        </div>
                        <div class="bar-item">
                            <div class="light" id="mth12"></div>
                            <span class="legend right">12</span>
                        </div>
                    </div>
                    <!-- Day Tens Bars -->
                    <div class="bar-group">
                        <div class="bar-item">
                            <div class="light" id="dayT0"></div>
                            <span class="legend right">0</span>
                        </div>
                        <div class="bar-item">
                            <div class="light" id="dayT1"></div>

                    <!-- Day Units Bars -->
                    <div class="bar-group">
                        <div class="bar-item">
                            <div class="light" id="dayU9"></div>

                </div>
            </section>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
